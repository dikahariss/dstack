id: careful
version: 0.2.0
description: |
  Safety guardrails for destructive commands. Reminds the user to pause before
  rm -rf, DROP TABLE, force-push, git reset --hard, kubectl delete, and similar
  destructive operations. Use when touching prod, debugging live systems, or
  working in a shared environment. Use when asked to "be careful", "safety
  mode", "prod mode", or "careful mode".

tools:
  - Bash
  - Read

context_budget_tokens: 1500

triggers:
  - be careful
  - warn before destructive
  - safety mode
  - prod mode

# Note: a strict version of /careful would use a PreToolUse hook to
# intercept bash commands before they run. dstack does not yet support
# hooks — see docs/plans/v1/DEFERRED.md entry D2. Today /careful is
# advisory text only. Hook-level enforcement will arrive via a new ADR
# when the hook engine is in place.
