name: brainstorm
version: 0.1.0
description: |
  Interview the user about a plan, design, or idea until reaching shared
  understanding. Walk every branch of the decision tree, asking one
  question at a time, recommending an answer with each question. Use
  when the user asks to "brainstorm", "grill me", "stress test this
  plan", "interview me", or "what do you think about this idea".

tools:
  - AskUserQuestion
  - Read
  - Grep
  - Glob

context_budget_tokens: 2000

triggers:
  - brainstorm
  - grill me
  - stress test
  - interview me
  - what do you think about this idea
